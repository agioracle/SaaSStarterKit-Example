name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      CLOUDFLARE_SEND_METRICS: 'false'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run i18n:check
      - run: npm run test:performance
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production -- --reporter=list
      - run: npm run test:lumina -- --reporter=list
      - name: Failure screenshots only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-screenshots
          path: .local-smoke/**/test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
# No secrets, remote databases, provider calls, deployment or npm publication.
